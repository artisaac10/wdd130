<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Isaac Fischer">
    <title> Green Bay Rafters | Contact us | Isaac Fischer </title>
    <meta name="description"
      content="Isaac Fischer, Student in WDD130, contact page for River Rafting">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Rafters Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="company-info">
            <h1>Green Bay Rafters</h1>
            <p>1265 Lombardi Ave, Green Bay, WI 54304-3927</p>
        </div>
        <div class="map">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d9580.2403739179!2d-88.06252869092486!3d44.499318217100544!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1790817588857!5m2!1sen!2sus"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <div class="contact-form">
            <form class="box">
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="Placeholder">
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input id="email" name="email" placeholder="Placeholder">
                </div>
                <div class="radio-group"> Message Purpose
                    <label for="general-inquiry">
                        <input type="radio" id="general-inquiry" name="purpose"
                          value="general-inquiry" checked>
                        General Inquiry
                    </label>

                    <label for="reservation-question">
                        <input type="radio" id="reservation-question" name="purpose"
                          value="reservation-question">
                        Reservation Question
                    </label>

                    <label for="website-suggestion">
                        <input type="radio" id="website-suggestion" name="purpose"
                          value="website-suggestion">
                        Website Suggestion
                    </label>
                </div>
                <div class="message-row">
                    <label for="message">Message</label>

                    <textarea id="message" name="message" placeholder="Type here"></textarea>

                </div>
                <label class="subscribe">
                    <input type="checkbox" checked id="checkbox" name="checkbox">
                    Please Subscribe me to the monthly newsletter
                </label>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="adventure">
            <h2>We Are Here to Serve You!</h2>

            <div class="adventure-gallery">
                <figure>
                    <img src="images/adventure-1.jpg" alt="HR">
                    <figcaption>Human Resources</figcaption>
                </figure>

                <figure>
                    <img src="images/adventure-2.jpg" alt="Our CEO">
                    <figcaption>CEO of Fun</figcaption>
                </figure>

                <figure>
                    <img src="images/adventure-3.jpg" alt="Our Accountant">
                    <figcaption>Accountant</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026 ❖ Green Bay Rafters ❖ Isaac Fischer</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://tiktok.com">
                <img src="images/tictok.svg" alt="TikTok Icon">
            </a>
            <a href="https://whatsapp.com">
                <img src="images/whatsapp.svg" alt="Whatsapp Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
