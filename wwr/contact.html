<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Isaac Fischer">
    <title> Green Bay Rafters | Contact us | Isaac Fischer </title>
    <meta name="description"
      content="Isaac Fischer, Student in WDD130, contact page for River Rafting">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Rafters Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="contact-form">
            <h1>Green Bay Rafters</h1>
            <h2>1265 Lombardi Ave, Green Bay, WI 54304-3927</h2>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d9580.2403739179!2d-88.06252869092486!3d44.499318217100544!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1790817588857!5m2!1sen!2sus"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form class="box">
                <div class="quiz-item box">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="Placeholder">
                </div>
                <div class="quiz-item box">
                    <label for="email">Email</label>
                    <input id="email" name="email" placeholder="Placeholder">
                </div>
                <div class="quiz-item box">
                    <label>
                        <input type="radio" name="purpose" id="purpose" checked>General
                        Inquiry</label>

                    <label>
                        <input type="radio" name="purpose" id="purpose">Reservation Question</label>

                    <label>
                        <input type="radio" name="purpose" id="purpose">Website Suggestion</label>
                </div>
                <div class="quiz-item box">
                    <label for="message">Message</label>

                    <textarea id="message" name="message" placeholder="Type here"></textarea>
                </div>

                <div class="quiz-item box">
                    <label for="q5">Please Subscribe me to the monthly newsletter</label>
                    <input type="checkbox" name="checkbox " id="checkbox">

                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="adventure">
            <h2>We Are Here to Serve You!</h2>

            <div class="adventure-gallery">
                <figure>
                    <img src="images/adventure-1.jpg" alt="Rafting adventure on a river">
                    <figcaption>River Adventure</figcaption>
                </figure>

                <figure>
                    <img src="images/adventure-2.jpg" alt="Rafters enjoying the rapids">
                    <figcaption>Exciting Rapids</figcaption>
                </figure>

                <figure>
                    <img src="images/adventure-3.jpg" alt="Rafting group on the water">
                    <figcaption>Explore the River</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026 ❖ Green Bay Rafters ❖ Isaac Fischer</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://tiktok.com">
                <img src="images/tictok.svg" alt="TikTok Icon">
            </a>
            <a href="https://whatsapp.com">
                <img src="images/whatsapp.svg" alt="Whatsapp Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
