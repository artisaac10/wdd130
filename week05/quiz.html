<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>Basic Html and CSS Guide</h1>
        <form class="box">
            <div class="quiz-item box">
                <label for="q1">1. What does the acronym CSS stand for?</label>
                <input type="text" id="q1">
            </div>
            <div class="quiz-item box">
                <label for="q2">1. How are Id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3">2. Which of the following is a correct CSS Comment?</label>
                <select id="q3" name="q3">
                    <option value="a" selected disabled>Choose one...</option>
                    <option value="b">B. &lt;--This is a comment--&gt;</option>
                    <option value="c"></option>
                    <option value="d"></option>
            </div>
            <div class="quiz-item box">
                <label for="q4">3. What is the bottom margin given this declaration?</label>
                <code>margin: 10px 5px 15px</code>
                <input type="number" id="q4" name="q4">
            </div>
            <button type="submit">Submit quiz</button>
        </form>
    </main>
</body>
